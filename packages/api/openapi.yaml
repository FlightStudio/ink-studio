openapi: 3.0.3
info:
  title: Ink Studio
  version: 0.0.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
    ApiErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - invalid_origin
        - unsupported_media_type
        - internal_error
        - no_organization
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
  responses:
    InvalidRequest:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Sign in is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: You cannot do that.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: That was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidOrigin:
      description: The origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: That file type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Something went wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NoOrganization:
      description: You are not in an organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
