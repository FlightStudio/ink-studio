openapi: 3.0.3
info:
  title: Ink Studio
  version: 0.0.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/letters:
    post:
      operationId: createLetter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLetterRequest"
      responses:
        "201":
          description: The letter was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedLetter"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/letters/{letterId}:
    parameters:
      - name: letterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLetter
      responses:
        "200":
          description: The letter's latest saved state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveLetter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLetterRequest"
      responses:
        "200":
          description: The letter was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLetter"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteLetter
      responses:
        "204":
          description: The letter was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/uploads:
    post:
      operationId: uploadFile
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UploadPurpose"
        - name: x-file-name
          in: header
          required: true
          description: The file's name, URI-encoded.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedAsset"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAsset
      responses:
        "302":
          description: A redirect to a fresh short signed URL for the file.
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/assets/{assetId}/status:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAssetStatus
      responses:
        "200":
          description: The asset's processing status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    PageFormatId:
      type: string
      enum:
        - thanksio:letter-windowless
        - thanksio:postcard-6x9
    LetterContentEnvelope:
      type: object
      additionalProperties: true
      required: [schemaVersion, format]
      properties:
        schemaVersion:
          type: integer
        format:
          type: string
    CreateLetterRequest:
      type: object
      additionalProperties: false
      properties:
        format:
          $ref: "#/components/schemas/PageFormatId"
    CreatedLetter:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    SaveLetterRequest:
      type: object
      additionalProperties: false
      required: [title, content, expectedRevision]
      properties:
        title:
          type: string
        content:
          $ref: "#/components/schemas/LetterContentEnvelope"
        expectedRevision:
          type: integer
          minimum: 1
    SavedLetter:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
    LetterState:
      type: object
      additionalProperties: false
      required: [title, revision, content]
      properties:
        title:
          type: string
        revision:
          type: integer
        content:
          $ref: "#/components/schemas/LetterContentEnvelope"
    UploadPurpose:
      type: string
      enum:
        - photo
        - mask
        - font-file
    UploadedAsset:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    AssetProcessingStatus:
      type: string
      enum:
        - pending
        - running
        - done
        - failed
    AssetStatus:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status:
          $ref: "#/components/schemas/AssetProcessingStatus"
        error:
          allOf:
            - $ref: "#/components/schemas/ApiErrorCode"
          nullable: true
    Health:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
    ApiErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - invalid_origin
        - unsupported_media_type
        - internal_error
        - no_organization
        - invalid_letter
        - invalid_title
        - stale_revision
        - file_too_large
        - unsupported_file
        - heic_not_supported
        - processing_failed
        - photo_unreadable
        - photo_too_large
        - no_ink_found
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
  responses:
    InvalidRequest:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Sign in is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: You cannot do that.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: That was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidOrigin:
      description: The origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: That file type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: This letter changed in another tab.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Something went wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NoOrganization:
      description: You are not in an organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
